
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medical Chatbot</title>

    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            background: linear-gradient(135deg, #0f172a, #111827, #1e293b);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        .chat-wrapper {
            width: 100%;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .chat-card {
            width: 100%;
            max-width: 950px;
            height: 95vh;
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(18px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 28px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
        }

        .chat-header {
            padding: 18px 24px;
            background: rgba(255, 255, 255, 0.04);
            border-bottom: 1px solid rgba(255,255,255,0.08);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .bot-avatar {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #22c55e;
            padding: 4px;
            background: #fff;
        }

        .header-info h4 {
            color: #fff;
            margin: 0;
            font-size: 20px;
            font-weight: 700;
        }

        .header-info p {
            margin: 0;
            color: #9ca3af;
            font-size: 14px;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #d1fae5;
            font-size: 14px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #22c55e;
            box-shadow: 0 0 10px #22c55e;
        }

        .chat-body {
            flex: 1;
            overflow-y: auto;
            padding: 24px 18px;
            scroll-behavior: smooth;
        }

        .chat-body::-webkit-scrollbar {
            width: 6px;
        }

        .chat-body::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.15);
            border-radius: 20px;
        }

        .message-row {
            display: flex;
            margin-bottom: 18px;
            width: 100%;
        }

        .message-row.user {
            justify-content: flex-end;
        }

        .message-row.bot {
            justify-content: flex-start;
        }

        .message-box {
            max-width: 78%;
            padding: 14px 18px;
            border-radius: 22px;
            position: relative;
            word-wrap: break-word;
            line-height: 1.6;
            font-size: 15px;
        }

        .user .message-box {
            background: linear-gradient(135deg, #2563eb, #3b82f6);
            color: white;
            border-bottom-right-radius: 6px;
            box-shadow: 0 8px 20px rgba(37, 99, 235, 0.35);
        }

        .bot .message-box {
            background: rgba(255,255,255,0.08);
            color: #f3f4f6;
            border: 1px solid rgba(255,255,255,0.08);
            border-bottom-left-radius: 6px;
        }

        .message-time {
            display: block;
            margin-top: 6px;
            font-size: 11px;
            opacity: 0.7;
            text-align: right;
        }

        .chat-footer {
            padding: 16px;
            background: rgba(255,255,255,0.04);
            border-top: 1px solid rgba(255,255,255,0.08);
        }

        .message-form {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .message-input {
            flex: 1;
            border: none;
            outline: none;
            padding: 16px 20px;
            border-radius: 18px;
            background: rgba(255,255,255,0.08);
            color: white;
            font-size: 15px;
        }

        .message-input::placeholder {
            color: #9ca3af;
        }

        .send-btn {
            width: 56px;
            height: 56px;
            border-radius: 18px;
            border: none;
            background: linear-gradient(135deg, #22c55e, #16a34a);
            color: white;
            font-size: 20px;
            cursor: pointer;
            transition: 0.3s ease;
            flex-shrink: 0;
        }

        .send-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 20px rgba(34,197,94,0.35);
        }

        .typing {
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .typing span {
            width: 8px;
            height: 8px;
            background: #fff;
            border-radius: 50%;
            animation: bounce 1.2s infinite;
        }

        .typing span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes bounce {
            0%, 80%, 100% {
                transform: scale(0);
                opacity: 0.5;
            }
            40% {
                transform: scale(1);
                opacity: 1;
            }
        }

        @media screen and (max-width: 768px) {
            html, body {
                height: 100%;
                overflow: hidden;
                position: fixed;
                width: 100%;
            }

            body {
                overflow: hidden;
            }

            .chat-wrapper {
                padding: 0;
            }

            .chat-card {
                width: 100%;
                height: 100vh;
                border-radius: 0;
                max-width: 100%;
            }

            .chat-header {
                padding: 14px 16px;
            }

            .header-info h4 {
                font-size: 17px;
            }

            .header-info p {
                font-size: 12px;
            }

            .bot-avatar {
                width: 44px;
                height: 44px;
            }

            .message-box {
                max-width: 88%;
                font-size: 14px;
                padding: 12px 14px;
            }

            .chat-body {
                padding: 16px 12px;
            }

            .message-input {
                font-size: 14px;
                padding: 14px 16px;
            }

            .send-btn {
                width: 50px;
                height: 50px;
                font-size: 18px;
            }

            .status {
                display: none;
            }
        }
    </style>
</head>

<body>

<div class="chat-wrapper">
    <div class="chat-card">

        <div class="chat-header">
            <div class="header-left">
                <img src="https://cdn-icons-png.flaticon.com/512/387/387569.png" class="bot-avatar">

                <div class="header-info">
                    <h4>Medical AI Assistant</h4>
                    <p>Ask medical questions anytime</p>
                </div>
            </div>

            <div class="status">
                <div class="status-dot"></div>
                Online
            </div>
        </div>

        <div id="messageFormeight" class="chat-body">

            <div class="message-row bot">
                <div class="message-box">
                    Hello 👋 I'm your AI medical assistant. How can I help you today?
                    <span class="message-time">Now</span>
                </div>
            </div>

        </div>

        <div class="chat-footer">
            <form id="messageArea" class="message-form">
                <input
                    type="text"
                    id="text"
                    name="msg"
                    placeholder="Type your medical question..."
                    autocomplete="off"
                    class="message-input"
                    required
                />

                <button type="submit" class="send-btn">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </form>
        </div>

    </div>
</div>

<script>
    $(document).ready(function () {

        function getCurrentTime() {
            const date = new Date();
            let hour = date.getHours();
            let minute = date.getMinutes();

            if (minute < 10) {
                minute = "0" + minute;
            }

            return hour + ":" + minute;
        }

        function scrollToBottom() {
            const chatBody = document.getElementById("messageFormeight");
            chatBody.scrollTop = chatBody.scrollHeight;
        }

        $("#messageArea").on("submit", function (event) {
            event.preventDefault();

            const rawText = $("#text").val();
            const str_time = getCurrentTime();

            if (rawText.trim() === "") {
                return;
            }

            const userHtml = `
                <div class="message-row user">
                    <div class="message-box">
                        ${rawText}
                        <span class="message-time">${str_time}</span>
                    </div>
                </div>
            `;

            $("#text").val("");
            $("#messageFormeight").append(userHtml);
            scrollToBottom();

            const typingHtml = `
                <div class="message-row bot" id="typing-indicator">
                    <div class="message-box">
                        <div class="typing">
                            <span></span>
                            <span></span>
                            <span></span>
                        </div>
                    </div>
                </div>
            `;

            $("#messageFormeight").append(typingHtml);
            scrollToBottom();

            $.ajax({
                data: {
                    msg: rawText,
                },
                type: "POST",
                url: "/get",
            }).done(function (data) {

                $("#typing-indicator").remove();

                const botHtml = `
                    <div class="message-row bot">
                        <div class="message-box">
                            ${data}
                            <span class="message-time">${str_time}</span>
                        </div>
                    </div>
                `;

                $("#messageFormeight").append(botHtml);
                scrollToBottom();
            });
        });
    });
</script>

</body>
</html>
```
